<html>
<head>
<title>Registration Form Validation</title>
</head>
<body bgcolor="#E4F0F8">
<script type='text/javascript'>
function formValidator()
{
    // Make quick references to our fields
    var firstname = document.getElementById('firstname');
    var lastname = document.getElementById('lastname');
    var email = document.getElementById('email');
    var pass = document.getElementById('pass');
    var addr = document.getElementById('addr');
    var mobileno = document.getElementById('mobileno');

    // 1. First Name: compulsory, alphabets only, min 3 characters
    if (!notEmpty(firstname, "Please enter your First Name")) return false;
    if (!isAlphabet(firstname, "First Name must contain only letters (no numbers)")) return false;
    if (!lengthRestriction(firstname, 3)) return false;

    // 2. Last Name: optional, but if entered must contain only letters
    if (lastname && lastname.value.trim().length > 0) {
        if (!isAlphabet(lastname, "Last Name must contain only letters")) return false;
    }

    // 3. Email Address: compulsory, must be a valid Gmail address ending with @gmail or @gmail.com
    if (!notEmpty(email, "Please enter your Email Address")) return false;
    if (!emailValidator(email, "Email must be a valid Gmail address ending with @gmail.com")) return false;

    // 4. Password: compulsory, min 6 characters, alphanumeric
    if (!notEmpty(pass, "Please enter your Password")) return false;
    if (!lengthRestriction(pass, 6)) return false;
    if (!isAlphanumeric(pass, "Password should contain letters and numbers only")) return false;

    // 5. Address: compulsory
    if (!notEmpty(addr, "Please enter your Address")) return false;

    // 6. Mobile Number: compulsory, digits only, exactly 10 digits
    if (!notEmpty(mobileno, "Please enter your 10-digit Mobile Number")) return false;
    if (!isNumeric(mobileno, "Mobile number must contain digits only")) return false;
    if (!lengthRestriction1(mobileno, 10, 10)) return false;

    // All details are correctly filled according to the criteria!
    return true;
}

function notEmpty(elem, helperMsg){
    if(!elem || elem.value.trim().length === 0){
        alert(helperMsg);
        if(elem) elem.focus();
        return false;
    }
    return true;
}

function isNumeric(elem, helperMsg){
    var numericExpression = /^[0-9]+$/;
    if(elem && elem.value.match(numericExpression)){
        return true;
    } else {
        alert(helperMsg);
        if(elem) elem.focus();
        return false;
    }
}

function isAlphabet(elem, helperMsg){
    var alphaExp = /^[a-zA-Z]+$/;
    if(elem && elem.value.match(alphaExp)){
        return true;
    } else {
        alert(helperMsg);
        if(elem) elem.focus();
        return false;
    }
}

function isAlphanumeric(elem, helperMsg){
    var alphaExp = /^[0-9a-zA-Z]+$/;
    if(elem && elem.value.match(alphaExp)){
        return true;
    } else {
        alert(helperMsg);
        if(elem) elem.focus();
        return false;
    }
}

function lengthRestriction(elem, min){
    var uInput = elem ? elem.value : "";
    if(uInput.length >= min){
        return true;
    } else {
        alert("Please enter minimum " + min + " characters");
        if(elem) elem.focus();
        return false;
    }
}

function emailValidator(elem, helperMsg){
    var emailExp = /^[\w\-\.\+]+@gmail(\.com)?$/i;
    if(elem && elem.value.match(emailExp)){
        return true;
    } else {
        alert(helperMsg);
        if(elem) elem.focus();
        return false;
    }
}

function lengthRestriction1(elem, min, max){
    var uInput = elem ? elem.value : "";
    if(uInput.length >= min && uInput.length <= max){
        return true;
    } else {
        alert("Please enter exactly 10 digits for Mobile Number");
        if(elem) elem.focus();
        return false;
    }
}
</script>

<center><font color="blue" size="6" face="arial">Registration Form</font></center><br />
<form onsubmit='return formValidator()' action="success.html">
First Name(Minimum 3 characters)<font color="red">* </font>
<input type='text' id='firstname' /><br /><br />
Last Name &nbsp;&nbsp;&nbsp;
<input type='text' id='lastname' /><br /><br />
Email Address<font color="red">* </font> &nbsp;&nbsp;&nbsp;
<input type='text' id='email' /><br />
<font color="red">(one e-mail id only):</font> &nbsp;&nbsp;&nbsp;
<font color="blue">e.g. smith@gmail.com</font><br /><br/>
Password(minimum 6 characters)<font color="red">* </font> &nbsp;&nbsp;&nbsp;
<input type='password' id='pass'><br /><br/>
Address<font color="red">* </font> &nbsp;&nbsp;&nbsp;
<textarea rows="2" cols="20" id='addr'></textarea> <br /> <br/>
Mobile No<font color="red">* </font> &nbsp;&nbsp;&nbsp;
<input type='text' id='mobileno' maxlength='10' oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);" placeholder="10 digits only" /><br /><br />
Gender: <input type='radio' name="gender" value="male" checked>male
<input type='radio' name="gender" value="female">female<br/><br />
<input type='Submit' value='submit' />
<input type='Reset' value='reset' />
</form>
</body>
</html>
